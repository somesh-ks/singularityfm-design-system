name: agent-eval

# The agent test (DS-14, DS-16) in CI: Claude Code and the Antigravity CLI each build every frozen task in
# a new Astro app with the published package, graded with no model call. Weekly, after release.yml's
# Monday run, only with the guide line (the setup the docs change); after each publish and on demand,
# also without it (owner, 2026-11-14).
# The reader app setup stays on the owner's computer: this repository is public and the app is not.
#
# The agent may run any command, so it runs in a container (scripts/agentEval/ci.sh) that gets the
# repository read-only, one credential and nothing else of the runner: no runner token, no cache, no
# step files, no sudo on the host. Claude Code holds no key (DS-17): it signs in with GitHub's identity
# token for this workflow on main in the `agent-eval` environment, which Anthropic trades for a token
# of at most ten minutes in a workspace with a monthly spend limit. Antigravity's Gemini key is made only for this,
# with its own limit, in that environment, which only main can use. Nothing runs on a pull request and
# no transcript is uploaded (GitHub masks secrets in logs, not in artifacts). The summary rows reach
# the job summary, and each task's counts and yes-or-no grades, with none of the agent's text, are kept
# as an artifact for compare.mjs. An agent whose sign-in is not set up is skipped with a warning.
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    # A release run publishes on the version pull request's merge (a push to main) or when started by
    # hand; its pull request runs (canary) never start this.
    if: >-
      github.repository == 'somesh-ks/singularityfm-design-system' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, antigravity]
    runs-on: ubuntu-latest
    # At most 16 tasks of 15 minutes plus about a minute of grading each, and the installs: under 280.
    timeout-minutes: 330
    environment: agent-eval
    env:
      # Weekly, only the setup a docs change moves; after a publish or by hand, both (DS-18).
      SETUPS: ${{ github.event_name == 'schedule' && 'bare-guide' || 'bare-guide,bare' }}
    # The identity token Claude Code signs in with. The runner asks for it; the container never gets
    # the request token, only the identity token itself. The antigravity job has the right too (one job,
    # two agents) and passes nothing of it on.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner holds both jobs' credentials; the container is given only this job's, no added
      # privileges, and no route to the VM's metadata endpoints.
      - name: Run the tasks
        id: run
        env:
          AGENT: ${{ matrix.agent }}
          AGY_MODEL: ${{ vars.AGY_MODEL }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_FEDERATION_RULE_ID || '' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_ORGANIZATION_ID || '' }}
          GEMINI_API_KEY: ${{ matrix.agent == 'antigravity' && secrets.GEMINI_API_KEY || '' }}
        run: |
          if [ "$AGENT" = claude ]; then
            needs=(ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID)
          else
            needs=(GEMINI_API_KEY)
          fi
          for name in "${needs[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::warning::no $name in the agent-eval environment; $AGENT did not run"
              exit 0
            fi
          done
          for address in 169.254.169.254 168.63.129.16; do
            sudo iptables -I DOCKER-USER -d "$address" -j DROP
          done
          mkdir -p "$RUNNER_TEMP/out"
          chmod a+rwx "$RUNNER_TEMP/out"
          pass=()
          for name in "${needs[@]}"; do pass+=(-e "$name"); done
          if [ "$AGENT" = claude ]; then
            # A GitHub identity token lasts about five minutes and Anthropic takes each one once. The
            # token it gives back lasts at most twice what the GitHub one has left (and the rule's ten
            # minutes); Claude Code keeps it in its config folder, shared by every task, and trades again
            # just before it ends, reading the file then. A fresh token every minute keeps an unused one,
            # with four minutes or more left, there.
            oidc="$RUNNER_TEMP/oidc"
            mkdir -p "$oidc"
            fetch() {
              local token
              token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -er .value) || return 1
              echo "::add-mask::$token"
              printf '%s' "$token" >"$oidc/token.next"
              mv -f "$oidc/token.next" "$oidc/token"
            }
            fetch || { echo "::error::GitHub gave no identity token"; exit 1; }
            (while sleep 60; do fetch || echo "::warning::the identity token was not renewed"; done) &
            renew=$!
            # Its sleep or curl first, so nothing it started holds the step's output open.
            trap 'pkill -P "$renew" 2>/dev/null; kill "$renew" 2>/dev/null || true' EXIT
            pass+=(-e ANTHROPIC_IDENTITY_TOKEN_FILE=/run/oidc/token -v "$oidc:/run/oidc:ro")
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          docker run --rm --init -e AGENT -e SETUPS -e AGY_MODEL "${pass[@]}" \
            --security-opt no-new-privileges --pids-limit 4096 \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" \
            node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496 \
            bash /src/scripts/agentEval/ci.sh
      # Everything in out/ was written by the agent's container, so it is read as untrusted: no links,
      # only the setups that ran, and its error text printed with workflow commands off. A setup where
      # no task finished (a spent limit, a wrong key or rule, a CLI that cannot sign in) fails the job, as
      # does a run that left no summary.
      - name: Report
        if: always() && steps.run.outputs.ran == 'true'
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          out="$RUNNER_TEMP/out"
          if [ -n "$(find "$out" -type l)" ]; then echo "::error::the run left links in its output"; exit 1; fi
          summary=$(find "$out" -mindepth 2 -maxdepth 2 -type f -name summary.md -print -quit)
          if [ -z "$summary" ]; then echo "::error::$AGENT ran but wrote no summary"; exit 1; fi
          dir=$(dirname "$summary")
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          status=0
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          for setup in ${SETUPS//,/ }; do
            if jq -e --arg setup "$setup" '[.rows[] | select(.setup == $setup and .finished)] | length > 0' \
              "$dir/summary.json" >/dev/null; then continue; fi
            echo "$AGENT finished no task in $setup:"
            find "$dir/$setup" -type f -name '*.stderr.txt' -print0 -quit | xargs -0 -r head -c 600 --
            echo
            status=1
          done
          echo "::$token::"
          # For compare.mjs: only known setups and task ids, a model name, numbers and yes-or-no values, so no text the agent wrote
          # (an import it made up, a file name) is kept where GitHub does not mask secrets.
          ids=$(jq -c '[.tasks[].id]' scripts/agentEval/tasks.json)
          jq --arg setups "$SETUPS" --arg agent "$AGENT" --argjson ids "$ids" '
            def num: if type == "number" then . else null end;
            def model: if type == "string" and test("^([a-z0-9.-]{1,40}|agy default)$") then . else "?" end;
            {rows: [.rows[] | select((.setup as $s | $setups | split(",") | index($s)) and
                                     (.task as $t | $ids | index($t)))
              | {setup, agent: $agent, task, model: (.model | model),
                 finished: (.finished == true), met: (.met | num), of: (.of | num),
                 invented: (.invented | length), outside_ui: (.outside_ui | length),
                 validate_errors: (.validate_errors | num),
                 compiled: (if .compiled == null then null else .compiled == true end),
                 used_ds: (.used_ds == true), read_guide: (.read_guide == true),
                 minutes: (.minutes | num), tokens: (.tokens | num)}]}' \
            "$dir/summary.json" > "$RUNNER_TEMP/summary.json" || status=1
          if [ "$status" -ne 0 ]; then echo "::error::$AGENT finished no task in a setup, or its rows did not read; see the log above"; fi
          exit "$status"
      - name: Keep the rows
        if: always() && steps.run.outputs.ran == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-rows-${{ matrix.agent }}
          path: ${{ runner.temp }}/summary.json
          if-no-files-found: ignore
          retention-days: 90
